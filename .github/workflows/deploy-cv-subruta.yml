name: Deploy CV to GitHub Pages Subroute

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-cv-subroute:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout CV dashboard repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build CV for /cv subroute
        run: npm run build:gh-cv

      - name: Checkout target GitHub Pages repo
        uses: actions/checkout@v4
        with:
          repository: maurihm/maurihm.github.io
          token: ${{ secrets.GH_PAGES_TOKEN }}
          path: target-pages
          persist-credentials: false

      - name: Sync build into /cv
        run: |
          mkdir -p target-pages/cv
          rsync -av --delete dist/cv-musk-style/browser/ target-pages/cv/

      - name: Commit and push if there are changes
        run: |
          cd target-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cv
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Deploy CV from cv-musk-style-crud"
          git push
