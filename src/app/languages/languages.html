<div class="languages-section">
  <h2>Idiomas</h2>
  
  <div *ngIf="languagesList.length > 0; else noData">
    <ul *ngFor="let lang of languagesList" class="language-item">
      <li>
        <h3>{{ lang.language }}</h3>
        <p class="language-level"><strong>{{ lang.level }}</strong></p>
      </li>
    </ul>
  </div>
  
  <ng-template #noData>
    <p style="color: #999; font-style: italic;">Sin datos disponibles</p>
  </ng-template>
</div>
